repos:
  # Public HTTPS lets CI build the hook environment without SSH credentials.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v0.13.1
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .*_test.*|yarn\.lock|cassettes/.*|test_json/.*|poetry.lock
